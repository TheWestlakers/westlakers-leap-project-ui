<!-- WATCHLIST -->
<div class="watchlist-card">
  <div class="watchlist-header">
    <div class="wl-title-group">
      <span class="wl-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.5L6 22V4.5Z"></path>
        </svg>
      </span>
      <span class="wl-title">WATCHLIST</span>
    </div>
    <button 
      class="wl-edit-btn" 
      (click)="toggleWatchlistEdit()"
    >
      {{ isEditingWatchlist() ? 'Done' : 'Edit (' + watchlist().length + ')' }}
    </button>
  </div>

  <div class="wl-items">
    <div
      *ngFor="let item of watchlist(); let i = index"
      class="wl-item"
      [class.wl-item-highlight]="i === 0 && !isSelectable() && highlightFirstItem()"
      [class.wl-item-no-hover]="!isSelectable()"
      [class.wl-item-portfolio]="!isSelectable()"
      [class.wl-item-selectable]="isSelectable()"
      [class.wl-item-selected]="isSelectable() && item.symbol === selectedSymbol()"
      (click)="onItemClick(item.symbol)"
    >
      <div class="wl-left">
        <span class="wl-symbol">{{ item.symbol }}</span>
        <span class="wl-name">{{ item.name }}</span>
      </div>

      <div class="wl-right">
        <span class="wl-price">{{ getPrice(item.symbol) }}</span>
      </div>

      <button
        *ngIf="isEditingWatchlist()"
        class="wl-remove-btn"
        (click)="removeWatchlistItem(item.symbol); $event.stopPropagation()"
      >×</button>
    </div>
  </div>

  <!-- Add form -->
  <div *ngIf="isEditingWatchlist()" class="wl-add-form">
    <input
      class="wl-input"
      placeholder="SYMBOL"
      [(ngModel)]="newSymbol"
      (keydown.enter)="addWatchlistItem()"
    />
    <input
      class="wl-input"
      placeholder="Company name (optional)"
      [(ngModel)]="newName"
      (keydown.enter)="addWatchlistItem()"
    />
    <button class="wl-add-btn" (click)="addWatchlistItem()">+ ADD TO WATCHLIST</button>
  </div>
</div>
