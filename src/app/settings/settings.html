<div class="min-h-screen bg-white p-6 flex flex-col gap-4">
  <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
  <div class="flex gap-4">
    <button type="button" (click)="onLogout()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">Log out</button>
    <a 
      routerLink="/dashboard" 
      class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors cursor-pointer"
    >
      Go to Dashboard
    </a>
    <a 
      routerLink="/login" 
      class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors cursor-pointer"
    >
      Go to Login
    </a>
  </div>
</div>
